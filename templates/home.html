<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shelter Website</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <!-- Template from (https://www.quackit.com/html/html_editors/scratchpad/?example=/html/templates/navbars/split_navbar) -->
    <header class="navbar">
      <div class="navbar__container">
        <h2>Animal Shelter</h2>

        <!-- Main Navigation -->
        <nav class="navbar__main-nav">
          <ul class="nav-list">
            <li><a href="#" class="nav-link">Home</a></li>
            <li><a href="volunteer" class="nav-link">Volunteer</a></li>
            <li><a href="contact" class="nav-link">Contact Us</a></li>
          </ul>
        </nav>

        <!-- User Actions -->
        <div class="navbar__user-actions">
          {% if current_user %}
          <a href="account" class="nav-link nav-link--login"
            >{{ current_user["first_name"] }}</a
          >

          {% if current_user["role"] == "admin" %}
          <p>Administrator Account</p>
          {% endif %} {% else %}
          <a href="{{ url_for('auth.login') }}" class="nav-link nav-link--login"
            >Log In</a
          >
          <a
            href="{{ url_for('auth.register') }}"
            class="nav-link nav-link--cta"
            >Sign Up</a
          >
          {% endif %}
        </div>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
      <form id="search-form">
        <input
          type="text"
          id="search"
          placeholder="Search by name, breed, or animal type..."
          name="search"
        />
      </form>
    </div>

    <main class="content">
      <!-- ================================================================================================================ -->
      <!-- Filtering - (https://github.com/mmrahmanbappi/100-vanilla-javascript-projects/tree/main/10-ecommerce-business/073-product-filter-sort) -->

      <!-- Filters -->
      <div class="fg2">
        <form class="side" id="flt" aria-label="Filters">
          <!-- Animal Type -->
          <fieldset>
            <legend>Type</legend>
            <div data-facet="type"></div>
          </fieldset>
          <!-- Animal Breed -->
          <fieldset>
            <legend>Breed</legend>
            <div data-facet="breed"></div>
          </fieldset>
          <!-- Age (in years, but with a min max box) -->
          <fieldset>
            <legend>Age (years)</legend>
            <div class="pr2">
              <label class="sr-only" for="mn">Minimum age_months</label>
              <input id="mn" type="number" min="0" step="1" placeholder="Min" />
              <input id="mx" type="number" min="0" step="1" placeholder="Max" />
            </div>
          </fieldset>
          <!-- Animal's Size -->
          <fieldset>
            <legend>Size</legend>
            <div data-facet="size"></div>
          </fieldset>
          <!-- Animal's Gender -->
          <fieldset>
            <legend>Gender</legend>
            <div data-facet="sex"></div>
          </fieldset>
        </form>

        <!-- Sorting tool (sort by name, size, or age_months) -->
        <div>
          <div class="bar3">
            <span id="cnt" aria-live="polite"></span>
            <label class="sort">
              Sort
              <select id="sort">
                <option value="name">Name: A to Z</option>
                <option value="name_desc">Name: Z to A</option>
                <option value="young">Age: youngest first</option>
                <option value="old">Age: oldest first</option>
              </select>
            </label>
          </div>
          <div class="chips2" id="chips"></div>
          <div class="pg3" id="grid"></div>
        </div>
      </div>
    </main>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      // Fields that get a checkbox group in the sidebar
      const FACETS = ["type", "breed", "size", "sex"];
      const SIZE_ORDER = ["Small", "Medium", "Large"];
      const SORTS = {
        name: (a, b) => a.name.localeCompare(b.name),
        name_desc: (a, b) => b.name.localeCompare(a.name),
        young: (a, b) => a.age_months - b.age_months,
        old: (a, b) => b.age_months - a.age_months,
      };

      // REAL data taken from our table
      const P = {{ animals | tojson }};

      let chips = []; // [label, input element] for each active filter

      // Makes a list of only available animals
      const availableAnimals = P.filter((p) => p.status === "available");

      // Build a checkbox group for each facet from the values found in the data
      FACETS.forEach((f) => {
        const vals = [...new Set(availableAnimals.map((p) => p[f]))].sort(
          (a, b) =>
            f === "size"
              ? SIZE_ORDER.indexOf(a) - SIZE_ORDER.indexOf(b)
              : a.localeCompare(b),
        );
        $(`[data-facet=${f}]`).innerHTML = vals
          .map(
            (v) =>
              `<label class="c"><input type="checkbox" name="${f}" value="${v}"> ${v}<span class="n">${availableAnimals.filter((p) => p[f] === v).length}</span></label>`,
          )
          .join("");
      });

      //====================================================================================================================================

      // Read the current filters from the form
      function state() {
        const s = {
          min: $("#mn").value !== "" ? Number($("#mn").value) * 12 : 0,
          max: $("#mx").value !== "" ? Number($("#mx").value) * 12 : Infinity,
          sort: $("#sort").value,
          search: $("#search").value.trim().toLowerCase(),
        };

        FACETS.forEach(
          (f) => (s[f] = $$(`[name=${f}]:checked`).map((i) => i.value)),
        );

        return s;
      }

      // ==========================================================================================

      // Filter logic
      function run() {
        const s = state();

        // Filters out animals not marked as "available"
        // Filters out items provided by filters FACETS
        // Filters out things in the search bar (name, breed, type)
        const list = P.filter(
          (p) =>
            p.status === "available" &&
            FACETS.every((f) => !s[f].length || s[f].includes(p[f])) &&
            p.age_months >= s.min &&
            p.age_months <= s.max &&
            (!s.search ||
              p.name.toLowerCase().includes(s.search) ||
              p.breed.toLowerCase().includes(s.search) ||
              p.type.toLowerCase().includes(s.search)),
        ).sort(SORTS[s.sort]);

        // Shows out of how many available animals you are being shown
        const availableCount = P.filter((p) => p.status === "available").length;
        $("#cnt").textContent = `${list.length} of ${availableCount} animals`;

        // applied filter chips (the things above the results)
        chips = [
          ...FACETS.flatMap((f) =>
            $$(`[name=${f}]:checked`).map((i) => [i.value, i]),
          ),
          s.min && ["Age " + s.min + "+", $("#mn")],
          s.max !== Infinity && ["Age up to " + s.max + " months", $("#mx")],
        ].filter(Boolean);

        $("#chips").innerHTML =
          chips
            .map(
              ([label], i) =>
                `<button type="button" data-i="${i}" aria-label="Remove filter ${label}">${label} ✕</button>`,
            )
            .join("") +
          (chips.length
            ? '<button type="button" data-all>Clear all</button>'
            : "");

        // Display of animals
        $("#grid").innerHTML = list.length
          ? list
              .map(
                (p) =>
                  `
                    <article class="pd" href="animal_listing/${p.animal_id}">
                      <div class="sw3">
                        <img
                          src="/static/images/animals/${p.animal_id}.jpg"
                          onerror="this.onerror=null; this.src='/static/images/animals/default.jpg';"
                          alt="${p.name}"
                          class="animal-thumbnail"
                        >
                      </div>
                      <div class="t">
                        <b>${p.name}</b>
                        ${p.breed}<br>
                        Age ${
                          p.age_months >= 12
                            ? `${Math.round(p.age_months / 12)} ${Math.round(p.age_months / 12) === 1 ? "year" : "years"}`
                            : `${p.age_months} months`
                        } · ${p.size} · ${p.sex}
                      </div>
                    </article>
                    `,
              )
              .join("")
          : '<p class="none2">No animals match. Try removing a filter.</p>';
      }

      // Update page after events
      $("#flt").addEventListener("input", run);
      $("#sort").addEventListener("change", run);
      $("#search").addEventListener("input", run);
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if ("all" in b.dataset) {
          $("#flt").reset();
        } else {
          const el = chips[b.dataset.i][1];
          if (el.type === "number") el.value = "";
          else el.checked = el.defaultChecked;
        }
        run();
      });

      run();
    </script>
  </body>
</html>
