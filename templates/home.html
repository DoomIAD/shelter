<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shelter Website</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <!-- Template from (https://www.quackit.com/html/html_editors/scratchpad/?example=/html/templates/navbars/split_navbar) -->
    <header class="navbar">
      <div class="navbar__container">
        <h2>Animal Shelter</h2>

        <!-- Main Navigation -->
        <nav class="navbar__main-nav">
          <ul class="nav-list">
            <li><a href="#" class="nav-link">Home</a></li>
            <li><a href="volunteer" class="nav-link">Volunteer</a></li>
            <li><a href="contact" class="nav-link">Contact Us</a></li>
          </ul>
        </nav>

        <!-- User Actions -->
        <div class="navbar__user-actions">
          {% if current_user %}
          <a href="account" class="nav-link nav-link--login"
            >{{ current_user["first_name"] }}</a
          >

          {% if current_user["role"] == "admin" %}
          <p>Administrator Account</p>
          {% endif %} {% else %}
          <a href="{{ url_for('auth.login') }}" class="nav-link nav-link--login"
            >Log In</a
          >
          <a
            href="{{ url_for('auth.register') }}"
            class="nav-link nav-link--cta"
            >Sign Up</a
          >
          {% endif %}
        </div>
      </div>
    </header>
    <main class="content">
      <!-- ================================================================================================================ -->
      <!-- Filtering - (https://github.com/mmrahmanbappi/100-vanilla-javascript-projects/tree/main/10-ecommerce-business/073-product-filter-sort) -->

      <!-- Search Bar -->
      <div class="search-container">
        <form action="/action_page.php">
          <input type="text" placeholder="Search.." name="search" />
          <button type="submit"><i class="fa fa-search"></i></button>
        </form>
      </div>

      <!-- Filters -->
      <div class="fg2">
        <form class="side" id="flt" aria-label="Filters">
          <!-- Animal Type -->
          <fieldset>
            <legend>Type</legend>
            <div data-facet="animal_type"></div>
          </fieldset>
          <!-- Animal Breed -->
          <fieldset>
            <legend>Breed</legend>
            <div data-facet="breed"></div>
          </fieldset>
          <!-- Age (in years, but with a min max box) -->
          <fieldset>
            <legend>Age (years)</legend>
            <div class="pr2">
              <label class="sr-only" for="mn">Minimum age</label>
              <input id="mn" type="number" min="0" step="1" placeholder="Min" />
              <input id="mx" type="number" min="0" step="1" placeholder="Max" />
            </div>
          </fieldset>
          <!-- Animal's Size -->
          <fieldset>
            <legend>Size</legend>
            <div data-facet="size"></div>
          </fieldset>
          <!-- Animal's Gender -->
          <fieldset>
            <legend>Gender</legend>
            <div data-facet="gender"></div>
          </fieldset>
        </form>

        <!-- Sorting tool (sort by name, size, or age) -->
        <div>
          <div class="bar3">
            <span id="cnt" aria-live="polite"></span>
            <label class="sort">
              Sort
              <select id="sort">
                <option value="name">Name: A to Z</option>
                <option value="name_desc">Name: Z to A</option>
                <option value="young">Age: youngest first</option>
                <option value="old">Age: oldest first</option>
              </select>
            </label>
          </div>
          <div class="chips2" id="chips"></div>
          <div class="pg3" id="grid"></div>
        </div>
      </div>
    </main>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      // Fields that get a checkbox group in the sidebar
      const FACETS = ["animal_type", "breed", "size", "gender"];
      const SIZE_ORDER = ["Small", "Medium", "Large"];
      const SORTS = {
        name: (a, b) => a.name.localeCompare(b.name),
        name_desc: (a, b) => b.name.localeCompare(a.name),
        young: (a, b) => a.age - b.age,
        old: (a, b) => b.age - a.age,
      };

      // AI generated example data. Will need to be real items from our DB in final version
      const P = [
        {
          animal_id: 1001,
          name: "Biscuit",
          animal_type: "Dog",
          breed: "Labrador Retriever",
          age: 27,
          size: "Large",
          gender: "Male",
          status: "Available",
          animal_thumbnail: "/static/images/animals/1001.jpg",
        },
        {
          animal_id: 1002,
          name: "Luna",
          animal_type: "Cat",
          breed: "Domestic Shorthair",
          age: 7,
          size: "Small",
          gender: "Female",
          status: "Available",
          animal_thumbnail: "/static/images/animals/1002.jpg",
        },
        {
          animal_id: 1003,
          name: "Pepper",
          animal_type: "Dog",
          breed: "Beagle",
          age: 80,
          size: "Medium",
          gender: "Female",
          status: "Adopted",
          animal_thumbnail: "/static/images/animals/1003.jpg",
        },
        {
          animal_id: 1004,
          name: "Clover",
          animal_type: "Rabbit",
          breed: "Holland Lop",
          age: 24,
          size: "Small",
          gender: "Female",
          status: "Pending",
          animal_thumbnail: "/static/images/animals/1004.jpg",
        },
      ];

      let chips = []; // [label, input element] for each active filter

      // Build a checkbox group for each facet from the values found in the data
      FACETS.forEach((f) => {
        const vals = [...new Set(P.map((p) => p[f]))].sort((a, b) =>
          f === "size"
            ? SIZE_ORDER.indexOf(a) - SIZE_ORDER.indexOf(b)
            : a.localeCompare(b),
        );
        $(`[data-facet=${f}]`).innerHTML = vals
          .map(
            (v) =>
              `<label class="c"><input type="checkbox" name="${f}" value="${v}"> ${v}<span class="n">${P.filter((p) => p[f] === v).length}</span></label>`,
          )
          .join("");
      });

      //====================================================================================================================================
      // URL logic for filtered responses. Will probably remove later for simplicity. Just not a priority yet.
      // Restore filters from the URL
      function read() {
        const q = new URLSearchParams(location.search);
        FACETS.forEach((f) =>
          $$(`[name=${f}]`).forEach(
            (i) => (i.checked = q.getAll(f).includes(i.value)),
          ),
        );
        $("#mn").value = q.get("min_age") || "";
        $("#mx").value = q.get("max_age") || "";
        $("#sort").value = q.get("sort") || "name";
      }

      // Read the current filters from the form
      function state() {
        const s = {
          min: $("#mn").value !== "" ? Number($("#mn").value) * 12 : 0,

          max: $("#mx").value !== "" ? Number($("#mx").value) * 12 : Infinity,

          sort: $("#sort").value,
        };

        FACETS.forEach(
          (f) => (s[f] = $$(`[name=${f}]:checked`).map((i) => i.value)),
        );

        return s;
      }

      // Save filters to the URL
      function write(s) {
        const q = new URLSearchParams();
        FACETS.forEach((f) => s[f].forEach((v) => q.append(f, v)));
        if (s.min) q.set("min_age", s.min);
        if (s.max !== Infinity) q.set("max_age", s.max);
        if (s.sort !== "name") q.set("sort", s.sort);
        history.replaceState(
          null,
          "",
          q.toString() ? "?" + q : location.pathname,
        );
      }

      // ==========================================================================================

      // Filter logic
      function run() {
        const s = state();
        write(s);

        const list = P.filter(
          (p) =>
            p.status === "Available" &&
            FACETS.every((f) => !s[f].length || s[f].includes(p[f])) &&
            p.age >= s.min &&
            p.age <= s.max,
        ).sort(SORTS[s.sort]);

        $("#cnt").textContent = `${list.length} of ${P.length} animals`;

        // applied filter chips (the things above the results)
        chips = [
          ...FACETS.flatMap((f) =>
            $$(`[name=${f}]:checked`).map((i) => [i.value, i]),
          ),
          s.min && ["Age " + s.min + "+", $("#mn")],
          s.max !== Infinity && ["Age up to " + s.max + " months", $("#mx")],
        ].filter(Boolean);

        $("#chips").innerHTML =
          chips
            .map(
              ([label], i) =>
                `<button type="button" data-i="${i}" aria-label="Remove filter ${label}">${label} ✕</button>`,
            )
            .join("") +
          (chips.length
            ? '<button type="button" data-all>Clear all</button>'
            : "");

        $("#grid").innerHTML = list.length
          ? list
              .map(
                (p) =>
                  `
                    <article class="pd">
                      <div class="sw3">
                        <img
                          src="${p.animal_thumbnail || "/static/images/animals/default.jpg"}"
                          alt="${p.name}"
                          class="animal-thumbnail"
                        >
                      </div>
                      <div class="t">
                        <b>${p.name}</b>
                        ${p.breed}<br>
                        Age ${
                          p.age >= 12
                            ? `${Math.round(p.age / 12)} ${Math.round(p.age / 12) === 1 ? "year" : "years"}`
                            : `${p.age} months`
                        } · ${p.size} · ${p.gender}
                      </div>
                    </article>
                    `,
              )
              .join("")
          : '<p class="none2">No animals match. Try removing a filter.</p>';
      }

      $("#flt").addEventListener("input", run);
      $("#sort").addEventListener("change", run);
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if ("all" in b.dataset) {
          $("#flt").reset();
        } else {
          const el = chips[b.dataset.i][1];
          if (el.type === "number") el.value = "";
          else el.checked = el.defaultChecked;
        }
        run();
      });

      read();
      run();
    </script>
  </body>
</html>
