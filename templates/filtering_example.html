<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>
      Product Filter and Sort Live Demo | Vanilla JavaScript Project
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #eef1f4;
        --panel: #ffffff;
        --sunk: #f5f7f9;
        --ink: #16213a;
        --muted: #5b6679;
        --line: #c9d1dc;
        --ok: #0f7b4f;
        --err: #b42318;
        --warn: #a15c00;
        --accent-ink: #fff;
        --r-lg: 18px;
        --r-md: 10px;
        --r-sm: 6px;
        --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
        --code:
          "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
        color-scheme: light dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #0e1624;
          --panel: #162033;
          --sunk: #111a2a;
          --ink: #e6ebf2;
          --muted: #98a4b7;
          --line: #2b3852;
          --ok: #3dd68c;
          --err: #ff7a6e;
          --warn: #f2b84b;
        }
      }
      :root[data-theme="dark"] {
        --paper: #0e1624;
        --panel: #162033;
        --sunk: #111a2a;
        --ink: #e6ebf2;
        --muted: #98a4b7;
        --line: #2b3852;
        --ok: #3dd68c;
        --err: #ff7a6e;
        --warn: #f2b84b;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      [hidden] {
        display: none !important;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 17px/1.6 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      img,
      svg,
      canvas,
      video {
        max-width: 100%;
        display: block;
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* workspace */
      .workspace {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 24px;
        box-shadow:
          0 1px 0 var(--line),
          0 18px 40px -28px color-mix(in srgb, var(--ink) 40%, transparent);
      }

      label.field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 700;
      }
      input[type="text"],
      input[type="search"],
      input[type="number"],
      textarea,
      select {
        font: 16px/1.5 var(--body);
        color: var(--ink);
        background: var(--sunk);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 10px 12px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 140px;
      }
      select {
        width: auto;
        min-height: 42px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        border-color: var(--accent);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      :root {
        --accent: #0369a1;
      }
      .fg2 {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 20px;
        align-items: start;
      }
      .fg2 > * {
        min-width: 0;
      }
      .side {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px;
        position: sticky;
        top: 12px;
      }
      .side fieldset {
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 0 12px;
        margin: 0 0 12px;
      }
      .side legend {
        font-weight: 700;
        margin-bottom: 6px;
      }
      .side label.c {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 15px;
        margin: 4px 0;
      }
      .side .n {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }
      .pr2 {
        display: flex;
        gap: 8px;
      }
      .pr2 input {
        width: 100%;
        min-width: 0;
      }
      .cols {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cols label {
        position: relative;
      }
      .cols input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .cols span {
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
      .cols input:checked + span {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .cols input:focus-visible + span {
        outline: 3px solid var(--accent);
      }
      .bar3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .chips2 {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .none2 {
        grid-column: 1/-1;
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }
      @media (max-width: 760px) {
        .fg2 {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main>
        <section class="workspace" aria-labelledby="w-title">
          <div class="fg2">
            <form class="side" id="flt" aria-label="Filters">
              <fieldset>
                <legend>Category</legend>
                <div id="cats"></div>
              </fieldset>
              <fieldset>
                <legend>Price ($)</legend>
                <div class="pr2">
                  <label class="sr-only" for="mn">Minimum price</label
                  ><input
                    class="field"
                    id="mn"
                    type="number"
                    min="0"
                    placeholder="Min"
                    style="margin: 0"
                  /><label class="sr-only" for="mx">Maximum price</label
                  ><input
                    class="field"
                    id="mx"
                    type="number"
                    min="0"
                    placeholder="Max"
                    style="margin: 0"
                  />
                </div>
              </fieldset>
              <fieldset>
                <legend>Colour</legend>
                <div class="cols" id="cols"></div>
              </fieldset>
              <fieldset>
                <legend>Rating</legend>
                <label class="c"
                  ><input type="radio" name="rt" value="0" checked /> Any</label
                ><label class="c"
                  ><input type="radio" name="rt" value="4" /> 4 stars and
                  up</label
                ><label class="c"
                  ><input type="radio" name="rt" value="4.5" /> 4.5 stars and
                  up</label
                >
              </fieldset>
              <label class="c"
                ><input type="checkbox" id="stk" /> In stock only</label
              >
            </form>
            <div>
              <div class="bar3">
                <span id="cnt" aria-live="polite"></span
                ><label
                  class="field"
                  style="
                    margin: 0;
                    flex-direction: row;
                    align-items: center;
                    gap: 8px;
                  "
                  >Sort
                  <select id="sort">
                    <option value="pop">Most popular</option>
                    <option value="lo">Price: low to high</option>
                    <option value="hi">Price: high to low</option>
                    <option value="rt">Best rated</option>
                    <option value="new">Newest</option>
                  </select></label
                >
              </div>
              <div class="chips2" id="chips"></div>
              <div class="pg3" id="grid"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      // Shared helpers (same in every Browser AI Lab project)
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    </script>
    <script>
      (() => {
        const CATS = ["Mugs", "Bowls", "Vases", "Plates"],
          COLS = [
            ["white", "#F5F5F4"],
            ["sand", "#D6C7A1"],
            ["sage", "#9CAF88"],
            ["blue", "#4A6FA5"],
            ["black", "#1F2937"],
          ];
        const shape = {
          Mugs: '<path d="M20 25h50v45a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10z"/><path d="M70 35h8a10 10 0 0 1 0 20h-8" fill="none" stroke-width="6"/>',
          Bowls: '<path d="M10 40h80a40 30 0 0 1-80 0z"/>',
          Vases:
            '<path d="M40 10h20v12c14 8 18 22 18 38a28 28 0 0 1-56 0c0-16 4-30 18-38z"/>',
          Plates: '<ellipse cx="50" cy="50" rx="44" ry="18"/>',
        };

        const P = [
          {
            id: 1,
            name: "Speckled Ceramic Mug",
            cat: "Mugs",
            col: "white",
            price: 24,
            rating: 4.8,
            stock: true,
            pop: 450,
            added: 1,
          },

          {
            id: 2,
            name: "Rustic Ceramic Bowl",
            cat: "Bowls",
            col: "sage",
            price: 32,
            rating: 4.5,
            stock: true,
            pop: 380,
            added: 2,
          },

          // Insert additional products here
        ];

        $("#cats").innerHTML = CATS.map(
          (c) =>
            `<label class="c"><input type="checkbox" name="cat" value="${c}"> ${c}<span class="n">${P.filter((p) => p.cat === c).length}</span></label>`,
        ).join("");
        $("#cols").innerHTML = COLS.map(
          ([n, h]) =>
            `<label title="${n}"><input type="checkbox" name="col" value="${n}" aria-label="${n}"><span style="background:${h}"></span></label>`,
        ).join("");
        function read() {
          const q = new URLSearchParams(location.search);
          $$("[name=cat]").forEach(
            (i) => (i.checked = q.getAll("cat").includes(i.value)),
          );
          $$("[name=col]").forEach(
            (i) => (i.checked = q.getAll("color").includes(i.value)),
          );
          $("#mn").value = q.get("min") || "";
          $("#mx").value = q.get("max") || "";
          const rt = q.get("rating") || "0";
          $$("[name=rt]").forEach((i) => (i.checked = i.value === rt));
          $("#stk").checked = q.has("instock");
          $("#sort").value = q.get("sort") || "pop";
        }
        function state() {
          return {
            cats: $$("[name=cat]:checked").map((i) => i.value),
            cols: $$("[name=col]:checked").map((i) => i.value),
            min: +$("#mn").value || 0,
            max: +$("#mx").value || Infinity,
            rt: +$("[name=rt]:checked").value,
            stk: $("#stk").checked,
            sort: $("#sort").value,
          };
        }
        function write(s) {
          const q = new URLSearchParams();
          s.cats.forEach((c) => q.append("cat", c));
          s.cols.forEach((c) => q.append("color", c));
          if (s.min) q.set("min", s.min);
          if (s.max !== Infinity) q.set("max", s.max);
          if (s.rt) q.set("rating", s.rt);
          if (s.stk) q.set("instock", "1");
          if (s.sort !== "pop") q.set("sort", s.sort);
          history.replaceState(
            null,
            "",
            q.toString() ? "?" + q : location.pathname,
          );
        }
        function run() {
          const s = state();
          write(s);
          let list = P.filter(
            (p) =>
              (!s.cats.length || s.cats.includes(p.cat)) &&
              (!s.cols.length || s.cols.includes(p.col)) &&
              p.price >= s.min &&
              p.price <= s.max &&
              p.rating >= s.rt &&
              (!s.stk || p.stock),
          );
          const by = {
            pop: (a, b) => b.pop - a.pop,
            lo: (a, b) => a.price - b.price,
            hi: (a, b) => b.price - a.price,
            rt: (a, b) => b.rating - a.rating,
            new: (a, b) => b.added - a.added,
          };
          list.sort(by[s.sort]);
          $("#cnt").textContent = `${list.length} of ${P.length} products`;
          const chips = [
            ...s.cats.map((c) => ["cat", c, c]),
            ...s.cols.map((c) => ["col", c, "Colour: " + c]),
            ...(s.min ? [["min", "", "From $" + s.min]] : []),
            ...(s.max !== Infinity ? [["max", "", "Up to $" + s.max]] : []),
            ...(s.rt ? [["rt", "", s.rt + " stars and up"]] : []),
            ...(s.stk ? [["stk", "", "In stock"]] : []),
          ];
          $("#chips").innerHTML =
            chips
              .map(
                (c) =>
                  `<button type="button" data-k="${c[0]}" data-v="${c[1]}" aria-label="Remove filter ${c[2]}">${c[2]} ✕</button>`,
              )
              .join("") +
            (chips.length
              ? '<button type="button" data-k="all">Clear all</button>'
              : "");
          $("#grid").innerHTML = list.length
            ? list
                .map((p) => {
                  const h = COLS.find((c) => c[0] === p.col)[1];
                  return `<article class="pd"><div class="sw3" style="background:color-mix(in srgb,${h} 25%,var(--sunk))"><svg viewBox="0 0 100 100" aria-hidden="true" fill="${h}" stroke="${h}">${shape[p.cat]}</svg></div><div class="t"><b>${p.name}</b>$${p.price} · ${p.rating} ★${p.stock ? "" : '<div class="st">Sold out</div>'}</div></article>`;
                })
                .join("")
            : '<p class="none2">No products match. Try removing a filter.</p>';
        }
        $("#flt").addEventListener("input", run);
        $("#sort").onchange = run;
        $("#chips").onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const { k, v } = b.dataset;
          if (k === "all") {
            $("#flt").reset();
            $("[name=rt][value='0']").checked = true;
          }
          if (k === "cat" || k === "col")
            $(`[name=${k}][value="${v}"]`).checked = false;
          if (k === "min") $("#mn").value = "";
          if (k === "max") $("#mx").value = "";
          if (k === "rt") $("[name=rt][value='0']").checked = true;
          if (k === "stk") $("#stk").checked = false;
          run();
        };
        addEventListener("popstate", () => {
          read();
          run();
        });
        read();
        run();
      })();
    </script>
  </body>
</html>
