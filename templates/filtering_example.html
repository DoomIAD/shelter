<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>
      Product Filter and Sort Live Demo | Vanilla JavaScript Project
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #eef1f4;
        --panel: #ffffff;
        --sunk: #f5f7f9;
        --ink: #16213a;
        --muted: #5b6679;
        --line: #c9d1dc;
        --accent: #0369a1;
        --r-lg: 18px;
        --r-sm: 6px;
        --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
        color-scheme: light dark;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0e1624;
          --panel: #162033;
          --sunk: #111a2a;
          --ink: #e6ebf2;
          --muted: #98a4b7;
          --line: #2b3852;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 17px/1.6 var(--body);
      }
      svg {
        max-width: 100%;
        display: block;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .workspace {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 24px;
        box-shadow:
          0 1px 0 var(--line),
          0 18px 40px -28px color-mix(in srgb, var(--ink) 40%, transparent);
      }
      .fg2 {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 20px;
        align-items: start;
      }
      .fg2 > * {
        min-width: 0;
      }

      /* form controls */
      input[type="number"],
      select {
        font: 16px/1.5 var(--body);
        color: var(--ink);
        background: var(--sunk);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 10px 12px;
      }

      /* sidebar filters */
      .side {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px;
        position: sticky;
        top: 12px;
      }
      .side fieldset {
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 0 12px;
        margin: 0 0 12px;
      }
      .side legend {
        font-weight: 700;
        margin-bottom: 6px;
      }
      .side label.c {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 15px;
        margin: 4px 0;
      }
      .side .n {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }
      .pr2 {
        display: flex;
        gap: 8px;
      }
      .pr2 input {
        width: 100%;
        min-width: 0;
      }
      .cols {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cols label {
        position: relative;
      }
      .cols input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .cols span {
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
      .cols input:checked + span {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .cols input:focus-visible + span {
        outline: 3px solid var(--accent);
      }

      /* results area */
      .bar3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .sort {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 700;
      }
      .chips2 {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .none2 {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }
      .pg3 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
      }
      .pd {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .pd .sw3 {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }
      .pd .sw3 svg {
        width: 55%;
      }
      .pd div.t {
        padding: 10px 12px;
        font-size: 14px;
      }
      .pd b {
        display: block;
        font-size: 15px;
      }
      .pd .st {
        color: var(--err);
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .fg2 {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="workspace">
        <div class="fg2">
          <form class="side" id="flt" aria-label="Filters">
            <fieldset>
              <legend>Category</legend>
              <div id="cats"></div>
            </fieldset>
            <fieldset>
              <legend>Price ($)</legend>
              <div class="pr2">
                <label class="sr-only" for="mn">Minimum price</label>
                <input id="mn" type="number" min="0" placeholder="Min" />
                <label class="sr-only" for="mx">Maximum price</label>
                <input id="mx" type="number" min="0" placeholder="Max" />
              </div>
            </fieldset>
            <fieldset>
              <legend>Colour</legend>
              <div class="cols" id="cols"></div>
            </fieldset>
            <fieldset>
              <legend>Rating</legend>
              <label class="c">
                <input type="radio" name="rt" value="0" checked /> Any
              </label>
              <label class="c">
                <input type="radio" name="rt" value="4" /> 4 stars and up
              </label>
              <label class="c">
                <input type="radio" name="rt" value="4.5" /> 4.5 stars and up
              </label>
            </fieldset>
            <label class="c">
              <input type="checkbox" id="stk" /> In stock only
            </label>
          </form>

          <div>
            <div class="bar3">
              <span id="cnt" aria-live="polite"></span>
              <label class="sort">
                Sort
                <select id="sort">
                  <option value="pop">Most popular</option>
                  <option value="lo">Price: low to high</option>
                  <option value="hi">Price: high to low</option>
                  <option value="rt">Best rated</option>
                  <option value="new">Newest</option>
                </select>
              </label>
            </div>
            <div class="chips2" id="chips"></div>
            <div class="pg3" id="grid"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      const CATS = ["Mugs", "Bowls", "Vases", "Plates"];
      const COLS = {
        white: "#F5F5F4",
        sand: "#D6C7A1",
        sage: "#9CAF88",
        blue: "#4A6FA5",
        black: "#1F2937",
      };
      const SHAPES = {
        Mugs: '<path d="M20 25h50v45a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10z"/><path d="M70 35h8a10 10 0 0 1 0 20h-8" fill="none" stroke-width="6"/>',
        Bowls: '<path d="M10 40h80a40 30 0 0 1-80 0z"/>',
        Vases:
          '<path d="M40 10h20v12c14 8 18 22 18 38a28 28 0 0 1-56 0c0-16 4-30 18-38z"/>',
        Plates: '<ellipse cx="50" cy="50" rx="44" ry="18"/>',
      };
      const SORTS = {
        pop: (a, b) => b.pop - a.pop,
        lo: (a, b) => a.price - b.price,
        hi: (a, b) => b.price - a.price,
        rt: (a, b) => b.rating - a.rating,
        new: (a, b) => b.added - a.added,
      };

      const P = [
        {
          id: 1,
          name: "Speckled Ceramic Mug",
          cat: "Mugs",
          col: "white",
          price: 24,
          rating: 4.8,
          stock: true,
          pop: 450,
          added: 1,
        },
        {
          id: 2,
          name: "Rustic Ceramic Bowl",
          cat: "Bowls",
          col: "sage",
          price: 32,
          rating: 4.5,
          stock: true,
          pop: 380,
          added: 2,
        },
        // Insert additional products here
      ];

      let chips = []; // [label, input element] for each active filter

      $("#cats").innerHTML = CATS.map(
        (c) =>
          `<label class="c"><input type="checkbox" name="cat" value="${c}"> ${c}<span class="n">${P.filter((p) => p.cat === c).length}</span></label>`,
      ).join("");
      $("#cols").innerHTML = Object.entries(COLS)
        .map(
          ([n, h]) =>
            `<label title="${n}"><input type="checkbox" name="color" value="${n}" aria-label="${n}"><span style="background:${h}"></span></label>`,
        )
        .join("");

      // Restore filters from the URL
      function read() {
        const q = new URLSearchParams(location.search);
        $$("[name=cat]").forEach(
          (i) => (i.checked = q.getAll("cat").includes(i.value)),
        );
        $$("[name=color]").forEach(
          (i) => (i.checked = q.getAll("color").includes(i.value)),
        );
        $("#mn").value = q.get("min") || "";
        $("#mx").value = q.get("max") || "";
        const rt = q.get("rating") || "0";
        $$("[name=rt]").forEach((i) => (i.checked = i.value === rt));
        $("#stk").checked = q.has("instock");
        $("#sort").value = q.get("sort") || "pop";
      }

      // Read the current filters from the form
      function state() {
        return {
          cats: $$("[name=cat]:checked").map((i) => i.value),
          colors: $$("[name=color]:checked").map((i) => i.value),
          min: +$("#mn").value || 0,
          max: +$("#mx").value || Infinity,
          rt: +$("[name=rt]:checked").value,
          stk: $("#stk").checked,
          sort: $("#sort").value,
        };
      }

      // Save filters to the URL
      function write(s) {
        const q = new URLSearchParams();
        s.cats.forEach((c) => q.append("cat", c));
        s.colors.forEach((c) => q.append("color", c));
        if (s.min) q.set("min", s.min);
        if (s.max !== Infinity) q.set("max", s.max);
        if (s.rt) q.set("rating", s.rt);
        if (s.stk) q.set("instock", "1");
        if (s.sort !== "pop") q.set("sort", s.sort);
        history.replaceState(
          null,
          "",
          q.toString() ? "?" + q : location.pathname,
        );
      }

      function run() {
        const s = state();
        write(s);

        const list = P.filter(
          (p) =>
            (!s.cats.length || s.cats.includes(p.cat)) &&
            (!s.colors.length || s.colors.includes(p.col)) &&
            p.price >= s.min &&
            p.price <= s.max &&
            p.rating >= s.rt &&
            (!s.stk || p.stock),
        ).sort(SORTS[s.sort]);

        $("#cnt").textContent = `${list.length} of ${P.length} products`;

        chips = [
          ...$$("[name=cat]:checked").map((i) => [i.value, i]),
          ...$$("[name=color]:checked").map((i) => ["Colour: " + i.value, i]),
          s.min && ["From $" + s.min, $("#mn")],
          s.max !== Infinity && ["Up to $" + s.max, $("#mx")],
          s.rt && [s.rt + " stars and up", $("[name=rt]")], // "Any" radio
          s.stk && ["In stock", $("#stk")],
        ].filter(Boolean);

        $("#chips").innerHTML =
          chips
            .map(
              ([label], i) =>
                `<button type="button" data-i="${i}" aria-label="Remove filter ${label}">${label} ✕</button>`,
            )
            .join("") +
          (chips.length
            ? '<button type="button" data-all>Clear all</button>'
            : "");

        $("#grid").innerHTML = list.length
          ? list
              .map((p) => {
                const h = COLS[p.col];
                return `<article class="pd"><div class="sw3" style="background:color-mix(in srgb,${h} 25%,var(--sunk))"><svg viewBox="0 0 100 100" aria-hidden="true" fill="${h}" stroke="${h}">${SHAPES[p.cat]}</svg></div><div class="t"><b>${p.name}</b>$${p.price} · ${p.rating} ★${p.stock ? "" : '<div class="st">Sold out</div>'}</div></article>`;
              })
              .join("")
          : '<p class="none2">No products match. Try removing a filter.</p>';
      }

      $("#flt").addEventListener("input", run);
      $("#sort").addEventListener("change", run);
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if ("all" in b.dataset) {
          $("#flt").reset();
        } else {
          const el = chips[b.dataset.i][1];
          if (el.type === "number") el.value = "";
          else el.checked = el.defaultChecked;
        }
        run();
      });

      read();
      run();
    </script>
  </body>
</html>
